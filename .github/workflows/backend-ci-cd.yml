name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  backend-test-and-deploy:
    name: Backend - Test and Deploy
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: Koderz_Drive_Test
          MYSQL_USER: koderz
          MYSQL_PASSWORD: password123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u koderz -ppassword123 --silent 2>/dev/null; then
              echo "MySQL ready!"
              break
            fi
            echo "Waiting... attempt $i"
            sleep 3
          done

      - name: Run Backend Unit Tests
        working-directory: DriveBE
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/Koderz_Drive_Test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: koderz
          SPRING_DATASOURCE_PASSWORD: password123
          JWT_SECRET: 4J0A+/4bd3xsKejDJ0eQIBYRjdDbmH54NZuVrE9+138=
          SPRING_MAIL_HOST: smtp.gmail.com
          SPRING_MAIL_PORT: 587
          SPRING_MAIL_USERNAME: test@test.com
          SPRING_MAIL_PASSWORD: testpassword
          APP_ALLOWED_DOMAINS: koderztechnology.com,gmail.com
          CORS_ALLOWED_ORIGINS: http://localhost:3000
        run: mvn test -Dspring.profiles.active=test

      - name: Build JAR
        working-directory: DriveBE
        run: mvn clean package -DskipTests

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/koderzDrive
            git pull origin main
            cd DriveBE
            mvn clean package -DskipTests -q
            sudo systemctl restart koderzdrive.service
            sleep 10
            sudo systemctl is-active koderzdrive.service && echo "Backend OK!" || echo "Backend FAILED!"

  frontend-test-and-deploy:
    name: Frontend - Test and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: DriveFE/package-lock.json

      - name: Install Dependencies
        working-directory: DriveFE
        run: npm ci

      - name: Install terser
        working-directory: DriveFE
        run: npm install terser --save-dev

      - name: Build Frontend
        working-directory: DriveFE
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Copy build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "DriveFE/dist/*"
          target: "/home/ubuntu/koderzDrive/DriveFE/dist/"
          strip_components: 2

      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl reload nginx
            echo "Frontend deployed!"
