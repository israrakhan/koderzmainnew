version: '5.7.0'

services:

  mysql:
    image: mysql:8.0

    container_name: mysql

    environment:
      MYSQL_DATABASE: Koderz_Drive_Test
      MYSQL_USER: koderz
      MYSQL_PASSWORD: password123
      MYSQL_ROOT_PASSWORD: root123

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - my-ntw

  backend:
    build: ./DriveBE

    container_name: backend

    ports:
      - "8080:8080"

    env_file:
      - ./DriveBE/.env

    depends_on:

      - mysql
    networks:
      - my-ntw
    

  frontend:
    build: ./DriveFE

    container_name: frontend

    ports:
      - "80:80"

    depends_on:
      - backend
    networks:
      - my-ntw

volumes:
  mysql_data:

networks:
  my-ntw:
